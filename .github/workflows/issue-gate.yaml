name: Issue Gate

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing open issue to triage
        required: true
        type: number
      force_implementation:
        description: Attempt implementation regardless of the triage priority
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
      issue_author: ${{ steps.issue.outputs.author }}
      issue_author_id: ${{ steps.issue.outputs.author_id }}
      access_outcome: ${{ steps.access.outcome }}
      skip: ${{ steps.access.outputs.skip }}
      close_allowed: ${{ steps.access.outputs.close_allowed }}
      judge_outcome: ${{ steps.judge.outcome }}
      result: ${{ steps.judge.outputs.result }}
    steps:
      - name: Checkout the base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Nushell
        uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: 0.114.1

      - name: Resolve issue context
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: nu .github/scripts/contribution-gate.nu issue-context

      - name: Check issue author
        id: access
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTHOR: ${{ steps.issue.outputs.author }}
        run: nu .github/scripts/contribution-gate.nu issue-access

      - name: Prepare the Pullfrog request
        id: request
        if: steps.access.outcome == 'success' && (steps.access.outputs.skip != 'true' || inputs.force_implementation == true)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          AUTHOR_STATUS: ${{ steps.access.outputs.author_status }}
          CLOSE_ALLOWED: ${{ steps.access.outputs.close_allowed }}
        run: nu .github/scripts/contribution-gate.nu issue-request

      - name: Ask Luna for an issue verdict
        id: judge
        if: steps.access.outcome == 'success' && (steps.access.outputs.skip != 'true' || inputs.force_implementation == true)
        continue-on-error: true
        uses: pullfrog/pullfrog@c4d0ca6f15d12382ddd20d2010bc596b405f42f0 # v0.1.60
        with:
          prompt: ${{ steps.request.outputs.prompt }}
          timeout: 15m
          push: disabled
          shell: disabled
          progress_comments: disabled
          output_schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["decision", "priority", "implementation", "reason"],
              "properties": {
                "decision": {
                  "type": "string",
                  "enum": ["keep_open", "close", "needs_human"]
                },
                "priority": {
                  "type": "string",
                  "enum": ["priority:critical", "priority:high", "priority:medium", "priority:low"]
                },
                "implementation": {
                  "type": "string",
                  "enum": ["create_pr", "none"]
                },
                "reason": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 1200
                }
              }
            }
        env:
          GH_TOKEN: ${{ github.token }}

  apply:
    needs: triage
    if: >-
      always() &&
      needs.triage.result != 'cancelled' &&
      needs.triage.outputs.access_outcome == 'success' &&
      (needs.triage.outputs.skip != 'true' || inputs.force_implementation == true)
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
    outputs:
      implementation: ${{ steps.implementation_request.outputs.implementation || steps.verdict.outputs.implementation }}
      prompt: ${{ steps.implementation_request.outputs.prompt }}
      implementation_marker: ${{ steps.implementation_request.outputs.implementation_marker }}
      implementation_branch: ${{ steps.implementation_request.outputs.implementation_branch }}
      coauthor_trailer: ${{ steps.implementation_request.outputs.coauthor_trailer }}
      coauthor_email: ${{ steps.implementation_request.outputs.coauthor_email }}
    steps:
      - name: Checkout the base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Nushell
        uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: 0.114.1

      - name: Apply the issue verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          CLOSE_ALLOWED: ${{ needs.triage.outputs.close_allowed }}
          FORCE_IMPLEMENTATION: ${{ inputs.force_implementation == true }}
          JUDGE_OUTCOME: ${{ needs.triage.outputs.judge_outcome }}
          RESULT: ${{ needs.triage.outputs.result }}
        run: nu .github/scripts/contribution-gate.nu issue-verdict

      - name: Prepare the implementation request
        id: implementation_request
        if: steps.verdict.outcome == 'success' && steps.verdict.outputs.implementation == 'create_pr'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          ISSUE_AUTHOR: ${{ needs.triage.outputs.issue_author }}
          ISSUE_AUTHOR_ID: ${{ needs.triage.outputs.issue_author_id }}
        run: nu .github/scripts/contribution-gate.nu issue-implementation-request

  implement:
    needs:
      - triage
      - apply
    if: >-
      needs.triage.result == 'success' &&
      needs.apply.result == 'success' &&
      needs.apply.outputs.implementation == 'create_pr'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
      implementation: ${{ steps.artifact.outputs.implementation }}
    steps:
      - name: Checkout the base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Nushell
        uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: 0.114.1

      - name: Record the implementation base
        id: base
        shell: nu {0}
        run: |
          let result = do { run-external git rev-parse HEAD } | complete
          if $result.exit_code != 0 {
              error make {msg: $"Could not resolve the implementation base: ($result.stderr | str trim)"}
          }
          let common_dir = do { run-external git rev-parse '--path-format=absolute' '--git-common-dir' } | complete
          if $common_dir.exit_code != 0 {
              error make {msg: $"Could not resolve the implementation Git directory: ($common_dir.stderr | str trim)"}
          }
          [
              $"base_sha=($result.stdout | str trim)"
              $"common_git_dir=($common_dir.stdout | str trim)"
          ]
          | str join "\n"
          | $in + "\n"
          | save --append $env.GITHUB_OUTPUT

      - name: Guard the implementation request
        id: implementation_guard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
        run: nu .github/scripts/contribution-gate.nu issue-implementation-guard

      - name: Ask Pullfrog to implement the issue
        id: pullfrog
        if: steps.implementation_guard.outputs.skip != 'true'
        uses: pullfrog/pullfrog@c4d0ca6f15d12382ddd20d2010bc596b405f42f0 # v0.1.60
        with:
          prompt: ${{ needs.apply.outputs.prompt }}
          timeout: 1h
          push: disabled
          shell: restricted
          progress_comments: disabled
          output_schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["implementation", "title", "body"],
              "properties": {
                "implementation": {
                  "type": "string",
                  "enum": ["prepared", "none"]
                },
                "title": {
                  "type": "string",
                  "maxLength": 240
                },
                "body": {
                  "type": "string",
                  "maxLength": 20000
                }
              },
              "oneOf": [
                {
                  "properties": {
                    "implementation": {"const": "prepared"},
                    "title": {"minLength": 1},
                    "body": {"minLength": 1}
                  }
                },
                {
                  "properties": {
                    "implementation": {"const": "none"},
                    "title": {"maxLength": 0},
                    "body": {"maxLength": 0}
                  }
                }
              ]
            }
        env:
          GH_TOKEN: ${{ github.token }}
          PULLFROG_CONTRIBUTION_GATE: 'true'

      - name: Prepare the implementation artifact
        id: artifact
        if: steps.pullfrog.outcome == 'success'
        shell: nu {0}
        env:
          RESULT: ${{ steps.pullfrog.outputs.result }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          IMPLEMENTATION_PATCH: ${{ runner.temp }}/implementation.patch
          IMPLEMENTATION_METADATA: ${{ runner.temp }}/implementation.json
          IMPLEMENTATION_GIT_COMMON_DIR: ${{ steps.base.outputs.common_git_dir }}
          IMPLEMENTATION_WORKSPACE: ${{ github.workspace }}
          SAFE_TEMP_ROOT: ${{ runner.temp }}
        run: |
          def safe-git [safe_git: string, safe_index: string, args: list<string>]: nothing -> record {
              let objects = [$env.IMPLEMENTATION_GIT_COMMON_DIR 'objects'] | path join
              let safe_environment = [
                  '-i'
                  'PATH=/usr/bin:/bin'
                  $"HOME=($env.SAFE_TEMP_ROOT)"
                  'LC_ALL=C'
                  'GIT_CONFIG_NOSYSTEM=1'
                  'GIT_CONFIG_GLOBAL=/dev/null'
                  'GIT_ATTR_NOSYSTEM=1'
                  $"GIT_DIR=($safe_git)"
                  $"GIT_WORK_TREE=($env.IMPLEMENTATION_WORKSPACE)"
                  $"GIT_INDEX_FILE=($safe_index)"
                  $"GIT_ALTERNATE_OBJECT_DIRECTORIES=($objects)"
              ]
              do { run-external /usr/bin/env ...$safe_environment /usr/bin/git ...$args } | complete
          }

          def safe-git-run [safe_git: string, safe_index: string, args: list<string>]: nothing -> nothing {
              let result = safe-git $safe_git $safe_index $args
              if $result.exit_code != 0 {
                  error make {
                      msg: $"git ($args | str join ' ') failed with exit code ($result.exit_code): ($result.stderr | str trim)"
                  }
              }
          }

          let result = try {
              $env.RESULT | from json
          } catch {
              error make {msg: 'Pullfrog returned invalid implementation JSON'}
          }
          let expected_fields = [body implementation title]
          if ($result | describe) !~ '^record' or ($result | columns | sort) != $expected_fields {
              error make {msg: 'Pullfrog returned unexpected implementation fields'}
          }

          let safe_root_result = do {
              run-external /usr/bin/mktemp '-d' $"($env.SAFE_TEMP_ROOT)/pullfrog-issue-gate.XXXXXX"
          } | complete
          if $safe_root_result.exit_code != 0 {
              error make {msg: $"Could not create sterile Git metadata: ($safe_root_result.stderr | str trim)"}
          }
          let safe_root = $safe_root_result.stdout | str trim
          let safe_git = [$safe_root 'git'] | path join
          let safe_index = [$safe_root 'index'] | path join
          let bootstrap_environment = [
              '-i'
              'PATH=/usr/bin:/bin'
              $"HOME=($env.SAFE_TEMP_ROOT)"
              'LC_ALL=C'
              'GIT_CONFIG_NOSYSTEM=1'
              'GIT_CONFIG_GLOBAL=/dev/null'
          ]
          let init = do {
              run-external /usr/bin/env ...$bootstrap_environment /usr/bin/git init '--bare' '--quiet' $safe_git
          } | complete
          if $init.exit_code != 0 {
              error make {msg: $"Could not initialize sterile Git metadata: ($init.stderr | str trim)"}
          }
          safe-git-run $safe_git $safe_index [update-ref HEAD $env.BASE_SHA]
          safe-git-run $safe_git $safe_index [read-tree $env.BASE_SHA]
          let status = safe-git $safe_git $safe_index [status '--porcelain=v1' '-z' '--untracked-files=all' '--ignored=traditional']
          if $status.exit_code != 0 {
              error make {msg: $"Could not inspect the implementation working tree: ($status.stderr | str trim)"}
          }
          let changes = $status.stdout | split row (char nul) | where {|entry| $entry | is-not-empty}

          if $result.implementation == 'none' {
              if ($changes | is-not-empty) {
                  error make {msg: 'Pullfrog declined implementation after changing the working tree'}
              }
          } else if $result.implementation == 'prepared' {
              let metadata_is_valid = [
                  (($result.title | str trim | is-not-empty) and (($result.title | lines | length) == 1))
                  (($result.title | str length) <= 240)
                  (($result.body | str trim | is-not-empty) and (($result.body | str length) <= 20000))
              ] | all {|valid| $valid}
              if not $metadata_is_valid {
                  error make {msg: 'Pullfrog returned invalid implementation PR metadata'}
              }

              let changed_paths = $changes | each {|entry| $entry | str substring 3..}
              if ($changed_paths | is-empty) or ($changed_paths | length) > 100 {
                  error make {msg: 'Pullfrog implementation must change between 1 and 100 files'}
              }
              let untracked = $changes
              | where {|entry| ($entry | str starts-with '?? ') or ($entry | str starts-with '!! ')}
              | each {|entry| $entry | str substring 3..}
              if ($untracked | is-not-empty) {
                  safe-git-run $safe_git $safe_index [add '--intent-to-add' '--force' '--' ...$untracked]
              }

              let changed = safe-git $safe_git $safe_index [diff '--no-ext-diff' '--no-textconv' '--quiet' HEAD '--']
              if $changed.exit_code == 0 {
                  error make {msg: 'Pullfrog reported a prepared implementation without any changes'}
              }
              if $changed.exit_code != 1 {
                  error make {msg: $"Could not inspect implementation changes: ($changed.stderr | str trim)"}
              }
              safe-git-run $safe_git $safe_index [diff '--no-ext-diff' '--no-textconv' '--check' HEAD '--']

              let patch = safe-git $safe_git $safe_index [diff '--no-ext-diff' '--no-textconv' '--binary' '--full-index' HEAD '--']
              if $patch.exit_code != 0 {
                  error make {msg: $"Could not create the implementation patch: ($patch.stderr | str trim)"}
              }
              if ($patch.stdout | encode utf8 | bytes length) > 5000000 {
                  error make {msg: 'Pullfrog implementation patch exceeds the 5 MB publication limit'}
              }
              $patch.stdout | save --raw $env.IMPLEMENTATION_PATCH
              $result | to json | save --raw $env.IMPLEMENTATION_METADATA
          } else {
              error make {msg: 'Pullfrog returned an unknown implementation result'}
          }

          $"implementation=($result.implementation)\n" | save --append $env.GITHUB_OUTPUT

      - name: Upload the implementation artifact
        if: steps.artifact.outputs.implementation == 'prepared'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-${{ needs.triage.outputs.issue_number }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/implementation.patch
            ${{ runner.temp }}/implementation.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - triage
      - apply
      - implement
    if: >-
      needs.triage.result == 'success' &&
      needs.apply.result == 'success' &&
      needs.implement.result == 'success' &&
      needs.implement.outputs.implementation == 'prepared'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      pull-requests: write
      id-token: none
    steps:
      - name: Checkout the implementation base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Nushell
        uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: 0.114.1

      - name: Download the implementation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-${{ needs.triage.outputs.issue_number }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/implementation

      - name: Publish the implementation pull request
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
          IMPLEMENTATION_BASE_SHA: ${{ needs.implement.outputs.base_sha }}
          IMPLEMENTATION_BRANCH: ${{ needs.apply.outputs.implementation_branch }}
          IMPLEMENTATION_MARKER: ${{ needs.apply.outputs.implementation_marker }}
          IMPLEMENTATION_METADATA: ${{ runner.temp }}/implementation/implementation.json
          IMPLEMENTATION_PATCH: ${{ runner.temp }}/implementation/implementation.patch
          COAUTHOR_TRAILER: ${{ needs.apply.outputs.coauthor_trailer }}
        run: nu .github/scripts/contribution-gate.nu publish-implementation

      - name: Verify issue author co-authorship
        if: steps.publish.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_AUTHOR_ID: ${{ needs.triage.outputs.issue_author_id }}
          IMPLEMENTATION_BRANCH: ${{ needs.apply.outputs.implementation_branch }}
          IMPLEMENTATION_MARKER: ${{ needs.apply.outputs.implementation_marker }}
          COAUTHOR_TRAILER: ${{ needs.apply.outputs.coauthor_trailer }}
          COAUTHOR_EMAIL: ${{ needs.apply.outputs.coauthor_email }}
        run: nu .github/scripts/contribution-gate.nu verify-coauthor
